<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
$head<title>$title</title>
<style>
body{font:14px/1.45 system-ui,sans-serif;margin:0 auto;padding:16px;max-width:1200px;color:#1b1b1b;background:#fafafa}
@media (prefers-color-scheme:dark){body{color:#e6e6e6;background:#151515}th{background:#222!important}td,th{border-color:#333!important}a{color:#8ab4f8}}
header a{margin-right:12px}h1{font-size:20px}h2{font-size:16px;margin-top:28px}
table{border-collapse:collapse;width:100%;overflow-x:auto;display:block}
th,td{border-bottom:1px solid #ddd;padding:4px 8px;text-align:left;vertical-align:top}
th{background:#eee;position:sticky;top:0}.flash{padding:8px;border:1px solid #c90;margin:8px 0}
pre{white-space:pre-wrap;word-break:break-word}input,select{font:inherit;margin:2px 0}
form{margin:12px 0;padding:8px;border:1px solid #9995}
.tabs{margin:12px 0}.bar{display:inline-block;height:10px;min-width:2px;background:#4a7fd4}
</style>
</head>
<body>
<header><a href="/ui">overview</a><a href="/ui/logout">sign out</a><small>read-only view; every change asks for your hub key</small></header>
$body
</body>
</html>
