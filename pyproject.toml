[project]
name = "agent-context-hub"
version = "0.1.0"
description = "Authenticated shared context, task state and memory for coding agents"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastembed==0.9.0",
    "fastapi>=0.120",
    "mcp>=2.3.0",
    "sqlite-vec==0.1.9",
    "uvicorn>=0.38",
]

[dependency-groups]
federation = ["nats-py==2.16.0"]
dev = ["ruff"]

[tool.ruff]
extend-include = ["plugins/hub/bin/hub"]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
